services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: maxcare
      POSTGRES_USER: maxcare
      POSTGRES_PASSWORD: maxcare_dev
    ports: ["5432:5432"]
    volumes: ["postgres_data:/var/lib/postgresql/data"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U maxcare -d maxcare"]
      interval: 5s
      timeout: 3s
      retries: 20
  api:
    build: .
    environment:
      DATABASE_URL: "${DATABASE_URL}"
      BETTER_AUTH_SECRET: ${BETTER_AUTH_SECRET:-development-secret-change-this-please-123456}
      BETTER_AUTH_URL: http://localhost:3000
      WEB_ORIGIN: ${WEB_ORIGIN:-http://localhost:5173}
      PORT: 3000
      NODE_ENV: development
    ports: ["3000:3000"]
    depends_on:
      db-migrate: { condition: service_completed_successfully }
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/api/v1/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 20s
  db-migrate:
    build:
      context: .
      target: migrator
    environment:
      DATABASE_URL: "${DATABASE_URL}"
      DIRECT_URL: "${DIRECT_URL}"
      APP_DB_PASSWORD: "${APP_DB_PASSWORD}"
      BETTER_AUTH_SECRET: ${BETTER_AUTH_SECRET:-development-secret-change-this-please-123456}
      BETTER_AUTH_URL: http://localhost:3000
      WEB_ORIGIN: ${WEB_ORIGIN:-http://localhost:5173}
      NODE_ENV: development
    command: sh -c "npm run db:role && npm run db:deploy && npm run db:grant"
    restart: "no"
volumes:
  postgres_data:
